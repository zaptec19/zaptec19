name: README build

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"      # 04:00 UTC daily
  workflow_dispatch:          # and a manual "Run workflow" button

permissions:
  contents: write             # the default token is read-only; the commit step needs this

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # generate.py uses only the standard library, so there is nothing to install
      - name: Rebuild README
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python3 generate.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cache/
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Update README stats"
          git push
