name: README build

# Runs only when you ask it to: Actions tab -> "README build" -> "Run workflow".
# Nothing is scheduled, and pushing does not trigger it. Each run recomputes
# every field from the live API, so it always catches up to current numbers.
on:
  workflow_dispatch:

permissions:
  contents: write             # the default token is read-only; the commit step needs this

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # generate.py uses only the standard library, so there is nothing to install
      - name: Rebuild README
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python3 generate.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md cache/
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Update README stats"
          git push
